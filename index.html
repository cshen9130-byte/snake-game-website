<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greedy Snake Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Welcome to Greedy Snake!</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>
    <div id="scoreBoard">
        <p id="score">Score: 0</p>
        <button id="restartButton">Restart</button>
    </div>
    <div id="loginForm">
        <h2>Login</h2>
        <form id="login">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="#" id="signupLink">Sign up</a></p>
    </div>
    <div id="signupForm" style="display: none;">
        <h2>Sign Up</h2>
        <form id="signup">
            <input type="text" id="newUsername" placeholder="Username" required>
            <input type="password" id="newPassword" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="#" id="loginLink">Login</a></p>
    </div>
    <script src="js/game.js"></script>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    const signupLink = document.getElementById("signupLink");
    const loginLink = document.getElementById("loginLink");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    // Toggle forms
    signupLink.addEventListener("click", (e) => {
        e.preventDefault();
        loginForm.style.display = "none";
        signupForm.style.display = "block";
    });

    loginLink.addEventListener("click", (e) => {
        e.preventDefault();
        signupForm.style.display = "none";
        loginForm.style.display = "block";
    });

    // Handle Sign Up
    document.getElementById("signup").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("newUsername").value;
        const password = document.getElementById("newPassword").value;

        try {
            const res = await fetch("http://localhost:5000/signup", {  // change to your deployed backend URL if needed
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            alert(data.message || "Sign up complete!");
        } catch (err) {
            console.error(err);
            alert("Error signing up");
        }
    });

    // Handle Login
    document.getElementById("login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("http://localhost:5000/login", {  // change to deployed URL if needed
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            alert(data.message || "Login success!");
        } catch (err) {
            console.error(err);
            alert("Error logging in");
        }
    });
});
</script>

</body>
</html>
