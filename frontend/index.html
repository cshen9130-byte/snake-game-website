<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greedy Snake Game</title>
<style>
/* General styles */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(to bottom, #1e3c72, #2a5298);
  color: #fff;
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}
h1 {
  margin-top: 30px;
  font-size: 2em;
}

/* Game container */
#gameContainer {
  margin-top: 20px;
  background: #fff;
  border-radius: 10px;
  padding: 10px;
}
#gameCanvas {
  background-color: #000;
  display: block;
  margin: 0 auto;
  border-radius: 10px;
}

/* Scoreboard */
#scoreBoard {
  margin-top: 10px;
  font-size: 1.2em;
}

/* Buttons */
button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  border-radius: 5px;
  background-color: #ff6b6b;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}
button:hover {
  background-color: #ff4b4b;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);  
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: #fff;
  color: #333;
  padding: 30px;
  border-radius: 10px;
  width: 90%;
  max-width: 350px;
  text-align: center;
  position: relative;
}
.modal-content input {
  width: 80%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: 1px solid #ccc;
}
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 24px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>Greedy Snake Game</h1>

<!-- Player Info -->
<div id="playerInfo" style="display:none; text-align:center; margin:10px;">
    <p>Welcome, <span id="playerName"></span>!</p>
    <p>Your highest score: <span id="highestScore">0</span></p>
    <p>Your rank: <span id="playerRank">-</span></p>
</div>  

<!-- Game container (hidden until login) -->
<div id="gameContainer" style="display:none;">
    <button onclick="startGame()">Start Game</button>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p id="score">Score: 0</p>
</div>  

<div id="scoreBoard">Score: <span id="score">0</span></div>
  <!-- Add this below the scoreBoard -->
<button id="startGameBtn">Start Game</button>

<!-- Buttons to open modals -->
<button id="openSignup">Sign Up</button>
<button id="openLogin">Login</button>

<!-- Signup Modal -->
<div id="signupModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeSignup">&times;</span>
    <h2>Sign Up</h2>
    <input type="text" id="newUsername" placeholder="Username" required><br>
    <input type="password" id="newPassword" placeholder="Password" required><br>
    <button id="signupBtn">Sign Up</button>
  </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeLogin">&times;</span>
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button id="loginBtn">Login</button>
  </div>
</div>

  <!-- load your game logic (optional if you have it) -->
  <script defer src="game.js?v=1"></script>

  <!-- load your auth + modal logic -->
  <script defer src="script.js?v=3"></script>

</body>
</html>
